<html lang="en">

        .container { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        h1 { text-align: center; color: #333; margin-bottom: 6px; font-size: 18px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 12px; font-size: 12px; }
        .controls { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .control-row { display: flex; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .control-row:last-child { margin-bottom: 0; }
        .control-label { font-weight: 600; color: #333; min-width: 120px; }
        .metric-btn { padding: 8px 16px; border: 2px solid #ddd; background: white; border-radius: 20px; cursor: pointer; transition: all 0.3s; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .metric-btn:hover { border-color: #667eea; transform: translateY(-2px); }
        .metric-btn.selected { color: white; border-color: transparent; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; }
        .action-btn { margin-left: auto; padding: 10px 20px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: transform 0.2s; }

        .chart-wrapper { background: #fafafa; border-radius: 8px; padding: 8px; position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .main-chart { position: relative; flex: 1; min-height: 0; }

        .area-upper { opacity: 0.85; transition: all 0.3s; }
        .area-lower { opacity: 0.5; transition: all 0.3s; }
        .hover-line { stroke: #333; stroke-width: 1.5; stroke-dasharray: 5,5; opacity: 0; pointer-events: none; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.9); color: white; padding: 12px; border-radius: 8px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s; max-width: 320px; z-index: 100; }
        .tooltip-section { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #444; }
        .tooltip-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .tooltip-title { font-weight: 600; margin-bottom: 6px; color: #fff; }
        .tooltip-row { margin: 4px 0; display: flex; justify-content: space-between; align-items: center; }
        .tooltip-label { display: flex; align-items: center; gap: 6px; }
        .tooltip-value { font-weight: 600; margin-left: 10px; }
        .post-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .post-card { background: white; border-radius: 8px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .post-card h3 { font-size: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .post-card.weibo h3 { color: #F6C63C; }
        .post-card.xhs h3 { color: #B43970; }
        .post-content { font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 10px; max-height: 150px; overflow-y: auto; text-overflow: clip; }
        .post-content.long-text { max-height: 200px; overflow-y: auto; }
        .post-meta { font-size: 12px; color: #999; display: flex; gap: 15px; flex-wrap: wrap; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; }
        .axis-title { font-size: 12px; font-weight: 600; fill: #333; }
        .zero-line { stroke: #333; stroke-width: 2; }

        .reset-btn { padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        .range-display { font-size: 13px; color: #666; margin-left: 15px; }
        .selected-date-indicator { font-size: 14px; color: #667eea; font-weight: 600; margin-left: 10px; }
        .clear-posts-btn { padding: 6px 12px; background: #999; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        .clear-posts-btn:hover { background: #666; }
        .instruction { font-size: 12px; color: #999; margin-top: 5px; text-align: center; }
    </style>

            else if (allDates.length > 30) tickStep = 5;
            else if (allDates.length > 15) tickStep = 3;
            else if (allDates.length > 8) tickStep = 2;
            xAxisGroup.call(d3.axisBottom(xScale).tickFormat(d => d.slice(5)).tickValues(allDates.filter((d, i) => i % tickStep === 0)));
            
            yAxisGroup.call(d3.axisLeft(yScale).tickFormat(d => {
                const absVal = Math.abs(d);
                if (absVal >= 100000) return (absVal / 10000).toFixed(0) + 'w';
                if (absVal >= 10000) return (absVal / 10000).toFixed(0) + 'w';
                if (absVal >= 1000) return (absVal / 1000).toFixed(0) + 'k';
                return absVal.toString();
            }).ticks(6));
            
        }
        
        d3.selectAll('.metric-btn').on('click', function() {
            const metric = d3.select(this).attr('data-metric');
            if (selectedMetrics.includes(metric)) { 
                if (selectedMetrics.length > 1) selectedMetrics = selectedMetrics.filter(m => m !== metric); 
            }
            else selectedMetrics.push(metric);
            updateChart();
        });
        
        function toggleAll() {
            if (selectedMetrics.length === 6) selectedMetrics = ['weibo_repost'];
            else selectedMetrics = [...allMetrics];
            updateChart();
        }
        
        clickOverlay.on('mousemove', function(event) {
            const [mx, my] = d3.pointer(event);
            const date = xScale.domain().find(d => { const x = xScale(d); return mx >= x && mx < x + xScale.bandwidth(); });
            if (date) {
                const d = currentData.find(item => item.date === date);
                if (!d) return;
                
                const unselected = allMetrics.filter(m => !selectedMetrics.includes(m));
                let html = `<div class="tooltip-section"><div class="tooltip-title">📅 ${date}</div></div>`;
                
                if (selectedMetrics.length > 0) {
                    const upperTotal = selectedMetrics.reduce((sum, m) => sum + d[m], 0);
                    html += `<div class="tooltip-section"><div class="tooltip-title" style="color:#a78bfa;">📈 Upper: ${upperTotal.toLocaleString()}</div>`;
                    selectedMetrics.forEach(m => { html += `<div class="tooltip-row"><span class="tooltip-label"><span class="color-dot" style="background:${colors[m]}"></span>${metricNames[m]}</span><span class="tooltip-value">${d[m].toLocaleString()}</span></div>`; });
                    html += `</div>`;
                }
                
                if (unselected.length > 0) {
                    const lowerTotal = unselected.reduce((sum, m) => sum + d[m], 0);
                    html += `<div class="tooltip-section"><div class="tooltip-title" style="color:#9ca3af;">📉 Lower: ${lowerTotal.toLocaleString()}</div>`;
                    unselected.forEach(m => { html += `<div class="tooltip-row"><span class="tooltip-label"><span class="color-dot" style="background:${colors[m]}"></span>${metricNames[m]}</span><span class="tooltip-value">${d[m].toLocaleString()}</span></div>`; });
                    html += `</div>`;
                }
                
                tooltip.html(html).style('left', (event.pageX + 15) + 'px').style('top', (event.pageY - 10) + 'px').style('opacity', 1);
            }
        });
        
        clickOverlay.on('mouseleave', function() {
            tooltip.style('opacity', 0);
        });
        
        updateChart();
    </script>
</body>
</html>
